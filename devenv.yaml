# devenv.sh config for deephaven-server-docker -- see devenv.nix for the
# actual environment definition and its header comment for usage/rationale.
#
# Deliberately using devenv's own default nixpkgs input (the
# devenv-maintained "rolling" branch, tested against devenv releases) rather
# than pinning a raw nixos-unstable ourselves -- less likely to hit
# devenv/nixpkgs interop breakage than an arbitrary pin, and this is the
# input devenv would pick anyway if this file only declared `inputs: {}`.
# Same choice as deephaven-core/devenv.yaml and
# deephaven-base-images/devenv.yaml, for the same reason.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
